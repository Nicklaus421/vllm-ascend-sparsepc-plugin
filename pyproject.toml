[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ascend-sparse-pc"
version = "0.1.0"
description = "Sparse Prefix Caching for Hybrid and Recurrent LLM Serving (arXiv:2605.05219) — a monkey-patch plugin for vllm-ascend."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "vllm-ascend contributors" }]
dependencies = [
    "numpy",
    # NOTE: vllm_ascend is deliberately NOT declared as a dependency. It is
    # monkey-patched at runtime and must already be installed from source
    # (editable) in the target environment. Declaring it here would make
    # `pip install -e .` pull the PyPI ``vllm-ascend`` build (0.23.0/0.30.0),
    # which can shadow or clobber the local source checkout. ``apply()`` logs a
    # warning and no-ops when vllm-ascend is absent, so the dependency is not
    # needed for the plugin to be importable or unit-testable.
]

[project.optional-dependencies]
test = ["pytest"]

# Auto-load the monkey-patches when vllm starts. vllm discovers these entry
# points in both the engine-core and worker processes, so the coordinator patch
# and the model-runner patch both take effect without any launcher change.
[project.entry-points."vllm.general_plugins"]
ascend_sparse_pc = "vllm_ascend_sparse_pc:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
